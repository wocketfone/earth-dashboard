# A dress rehearsal of commissioning and of a reset, using the real sources. It changes nothing the instrument reads.
# It only writes a report, status/rehearsal.json. Runs only when asked.
name: Rehearse a reset
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: repo-writes
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node fetcher/rehearse.js
      - name: Save the report
        run: |
          git config user.name "earth-dashboard bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/rehearsal.json
          git diff --cached --quiet && exit 0
          git commit -m "Rehearsal report [skip ci]"
          git pull --rebase
          git push
