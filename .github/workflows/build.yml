# Reads every source and publishes public/frame-0.json. If a reset is due, it also builds the next scale (frame-1.json, and so on).
# Runs every hour at 17 minutes past, and whenever it is started by hand.
name: Build the frame
on:
  workflow_dispatch:
    inputs:
      fresh:
        description: 'Forget the previous digits for this run (use after a rule change)'
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency: repo-writes
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node fetcher/mapping.test.js
      - run: node fetcher/series.test.js
      - run: node fetcher/sources.test.js
      - run: node fetcher/build.test.js
      - run: node fetcher/build.js
        env:
          FRESH: ${{ inputs.fresh && '1' || '' }}
      - name: Save the result
        run: |
          git config user.name "earth-dashboard bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update frame [skip ci]"
          git pull --rebase
          git push
