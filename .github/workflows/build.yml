# Reads every source and publishes public/frame-0.json. Runs only when asked, until the schedule is switched on.
name: Build the frame
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: repo-writes
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetcher/mapping.test.js
      - run: node fetcher/series.test.js
      - run: node fetcher/sources.test.js
      - run: node fetcher/build.js
      - name: Save the result
        run: |
          git config user.name "earth-dashboard bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A status data public
          git diff --cached --quiet && exit 0
          git commit -m "Update frame [skip ci]"
          git pull --rebase
          git push
