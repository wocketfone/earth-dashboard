# Reads every source and publishes public/frame-0.json. If a reset is due, it also builds the next scale (frame-1.json, and so on).
# Runs twice an hour, and whenever it is started by hand. GitHub starts timed jobs late and sometimes skips one
# when it is busy, so the second try each hour keeps the frame from going more than an hour or so without a check.
name: Build the frame
on:
  workflow_dispatch:
    inputs:
      fresh:
        description: 'Forget the previous digits for this run (use after a rule change)'
        type: boolean
        default: false
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency: repo-writes
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node fetcher/mapping.test.js
      - run: node fetcher/series.test.js
      - run: node fetcher/sources.test.js
      - run: node fetcher/build.test.js
      - run: node fetcher/build.js
        env:
          FRESH: ${{ inputs.fresh && '1' || '' }}
      # A bench test file that changes on the hour. It must never hold up the real frame, so a failure here is ignored.
      - run: node fetcher/testfiles.js moving
        continue-on-error: true
      - name: Save the result
        run: |
          git config user.name "earth-dashboard bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update frame [skip ci]"
          git pull --rebase
          git push
