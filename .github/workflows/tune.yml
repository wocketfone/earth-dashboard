# A one-off study of the daily temperature sources. It only writes a report, status/tune.json.
name: Study the daily temperatures
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: repo-writes
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node fetcher/tune.js
      - name: Save the report
        run: |
          git config user.name "earth-dashboard bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/tune.json
          git diff --cached --quiet && exit 0
          git commit -m "Temperature study [skip ci]"
          git pull --rebase
          git push
