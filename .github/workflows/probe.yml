# Tries every data source once and saves a report to status/probe.json.
# It runs when asked, or when the fetcher code changes. It is not on a schedule.
name: Probe data sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['fetcher/**', '.github/workflows/probe.yml']
permissions:
  contents: write
concurrency: probe
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetcher/mapping.test.js
      - run: node fetcher/sources.test.js
      - run: node fetcher/probe.js
      - name: Save the report
        run: |
          git config user.name "earth-dashboard bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/
          git diff --cached --quiet && exit 0
          git commit -m "Probe report [skip ci]"
          git pull --rebase
          git push
