# Works out normal for every tube from the 2001-2020 record and saves data/normals-0.json. Runs only when asked.
name: Work out the normals
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: repo-writes
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node fetcher/mapping.test.js
      - run: node fetcher/series.test.js
      - run: node fetcher/sources.test.js
      - run: node fetcher/normals.js
      - name: Save the result
        run: |
          git config user.name "earth-dashboard bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update normals [skip ci]"
          git pull --rebase
          git push
